<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>
</head>

<body>

	<style>
		/* エラーになった入力欄 */
		.input-error {
			border: 2px solid #dc3545 !important;
			background-color: #f8d7da !important;
		}

		/* エラーメッセージ */
		.text-danger {
			color: #dc3545;
			font-weight: bold;
			margin-top: 4px;
			line-height: 1.3;
		}
	</style>

	<!-- 受講生 -->
	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
		<!-- 入力エラー -->
		<div th:if="${result != null and result.hasErrors()}" class="text-danger">

			<div th:each="error : ${result.allErrors}" th:text="${error.defaultMessage}">
			</div>

		</div>
	</th:block>

	<!-- 受講生以外 -->
	<th:block th:if="${session.loginUserDto.role != '0001'}">

		<h2>
			勤怠管理
			<small>( [[${attendanceForm.userName}]] )</small>
		</h2>

		<!-- 入力エラーメッセージ -->
		<div th:if="${result != null and result.hasErrors()}" class="text-danger">
			<div th:each="error : ${result.allErrors}" th:text="${error.defaultMessage}">
			</div>
		</div>

	</th:block>


	<div class="row">
		<div class="bs-component col-sm-12">

			<!-- 更新フォーム -->
			<form th:action="@{/attendance/update}" th:object="${attendanceForm}" method="post">

				<table class="table table-hover dataTable no-footer">

					<thead>
						<tr>
							<th class="w160">日付</th>
							<th class="w260">コース内容</th>
							<th class="w170">出勤</th>
							<th class="w170">退勤</th>
							<th class="w150">中抜け時間</th>
							<th class="w100">ステータス</th>
							<th class="w220">備考</th>
						</tr>
					</thead>

					<tbody>

						<th:block th:each="dailyAttendanceForm, stat : ${attendanceForm.attendanceList}">

							<tr>

								<!-- hidden -->

								<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|"
									th:value="${dailyAttendanceForm.isToday}" />

								<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|"
									th:value="${dailyAttendanceForm.studentAttendanceId}" />

								<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|"
									th:value="${dailyAttendanceForm.trainingDate}" />

								<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|"
									th:value="${dailyAttendanceForm.dispTrainingDate}" />

								<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|"
									th:value="${dailyAttendanceForm.sectionName}" />

								<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|"
									th:value="${dailyAttendanceForm.statusDispName}" />


								<!-- 日付 -->

								<td class="w160">
									[[${dailyAttendanceForm.dispTrainingDate}]]
								</td>


								<!-- コース内容 -->

								<td class="w260">
									[[${dailyAttendanceForm.sectionName}]]
								</td>


								<!-- 出勤 -->
								<td>

									<div style="display:flex; align-items:center; gap:5px;">

										<!-- 出勤：時 -->
										<select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|"
											th:id="|startHour_${stat.index}|" class="form-control" style="width:65px;"
											th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTimeHour')} ? ' input-error' : ''">

											<option value=""></option>

											<option th:each="hour : ${hours}" th:value="${hour}" th:text="${hour}"
												th:selected="${hour == dailyAttendanceForm.trainingStartTimeHour}">
											</option>

										</select>

										<span>：</span>


										<!-- 出勤：分 -->
										<select th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|"
											th:id="|startMinute_${stat.index}|" class="form-control" style="width:65px;"
											th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTimeMinute')} ? ' input-error' : ''">

											<option value=""></option>

											<option th:each="minute : ${minutes}" th:value="${minute}"
												th:text="${minute}"
												th:selected="${minute == dailyAttendanceForm.trainingStartTimeMinute}">
											</option>

										</select>

									</div>


								</td>


								<!-- 退勤 -->
								<td>

									<div style="display:flex; align-items:center; gap:5px;">

										<!-- 退勤：時 -->
										<select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|"
											th:id="|endHour_${stat.index}|" class="form-control" style="width:65px;"
											th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTimeHour')} ? ' input-error' : ''">

											<option value=""></option>

											<option th:each="hour : ${hours}" th:value="${hour}" th:text="${hour}"
												th:selected="${hour == dailyAttendanceForm.trainingEndTimeHour}">
											</option>

										</select>

										<span>：</span>


										<!-- 退勤：分 -->
										<select th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|"
											th:id="|endMinute_${stat.index}|" class="form-control" style="width:65px;"
											th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTimeMinute')} ? ' input-error' : ''">

											<option value=""></option>

											<option th:each="minute : ${minutes}" th:value="${minute}"
												th:text="${minute}"
												th:selected="${minute == dailyAttendanceForm.trainingEndTimeMinute}">
											</option>

										</select>

									</div>

								</td>


								<!-- 中抜け時間 -->
								<td class="w150">

									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control"
										th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].blankTime')} ? ' input-error' : ''">

										<option th:each="blankTime : ${attendanceForm.blankTimes}"
											th:value="${blankTime.key}" th:text="${blankTime.value}"
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">
										</option>

									</select>
								</td>


								<!-- ステータス -->

								<td class="w100">
									[[${dailyAttendanceForm.statusDispName}]]
								</td>


								<!-- 備考 -->
								<td class="w220">

									<input type="text" th:name="|attendanceList[${stat.index}].note|"
										th:value="${dailyAttendanceForm.note}" class="form-control"
										th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].note')} ? ' input-error' : ''" />


									<!-- 備考エラー -->
									<div class="text-danger" th:errors="*{attendanceList[__${stat.index}__].note}">
									</div>

								</td>

							</tr>

						</th:block>

					</tbody>

				</table>


				<!-- ボタン -->

				<div class="form-group">

					<!-- 戻る -->

					<a th:href="@{/attendance/detail}" class="btn btn-default">
						戻る
					</a>


					<!-- 更新 -->

					<input type="submit" value="更新" name="complete" class="btn btn-info"
						onclick="return confirmUpdate();" />

				</div>

			</form>

		</div>
	</div>


	<!-- JavaScript -->

	<script>

		/*
		 * 更新確認ダイアログ
		 *
		 * OK        → true  → フォーム送信
		 * キャンセル → false → フォーム送信しない
		 */
		function confirmUpdate() {

			return confirm("更新します。よろしいですか？");

		}


		/*
		 * 定時ボタンの処理
		 */
		function setRegularTime(button) {

			// 何行目の定時ボタンが押されたか
			const index = button.getAttribute("data-index");


			// 出勤 09:00

			const startHour =
				document.getElementById("startHour_" + index);

			const startMinute =
				document.getElementById("startMinute_" + index);


			// 退勤 18:00

			const endHour =
				document.getElementById("endHour_" + index);

			const endMinute =
				document.getElementById("endMinute_" + index);


			// 定時を設定

			startHour.value = "09";
			startMinute.value = "00";

			endHour.value = "18";
			endMinute.value = "00";

		}

	</script>

</body>

</html>
